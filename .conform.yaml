policies:
  - type: commit
    spec:
      header:
        length: 89
        imperative: true
        case: lower
        invalidLastCharacters: .
      dco: true
      spellcheck:
        locale: US
      maximumOfOneCommit: true
      conventional:
        types:
          - chore
          - docs
          - refactor
          - test
          - release
  - type: license
    spec:
      skipPaths:
        - .git/
      includeSuffixes:
        - .go
      allowPrecedingComments: true
      header: |
        // SPDX-License-Identifier: MIT
        // (c) Dennis Marttinen, Veeti Poutsalo 2026
